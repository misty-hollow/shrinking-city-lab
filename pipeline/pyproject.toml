[project]
name = "scl-pipeline"
version = "0.1.0"
description = "Shrinking City Lab 정적 데이터 생성·검증 도구. 기준: docs/설계안_v0.1.md 10-2절"
requires-python = ">=3.12,<3.13"

# PC 전용 전처리 도구다. 앱 런타임은 이 패키지가 만든 정적 JSON만 읽는다(설계안 10-1 10번).
# 걸어봄 data/ 패키지와 의존성을 공유하지 않는다(별도 패키지·별도 빌드, 10-1 13번).
dependencies = [
    "numpy==2.3.4",
    "openpyxl==3.1.5",
    "shapely==2.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
]

[tool.setuptools]
packages = ["scl_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# 줄 길이는 formatter가 맡는다. 한국어 문자열 리터럴은 formatter가 자르지 않는다.
ignore = ["E501"]
