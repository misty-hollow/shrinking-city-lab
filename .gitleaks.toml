# gitleaks 설정: 기본 규칙 그대로 + 좁은 예외 하나.
#
# 파생·앱 데이터의 provenance에는 원자료·코드 파일의 sha256(16진수 64자)이 들어간다. 그중 키 이름이
# "access"인 것(pipeline/derived/osrm_car_table.json의 step_code_sha256.access = access.py의 해시)을
# generic-api-key 규칙이 API 키로 오인한다. 비밀값이 아니고, 파일은 바이트 대조 대상이라 바꿀 수 없다.
# 예외는 세 조건을 모두 만족할 때만: 그 규칙 · 데이터 폴더의 JSON · 값이 정확히 16진수 64자.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "provenance sha256 digests in committed data JSON"
condition = "AND"
regexTarget = "secret"
regexes = ['''^[0-9a-f]{64}$''']
paths = ['''^pipeline/derived/[^/]+\.json$''', '''^app/public/data/[^/]+\.json$''', '''^pipeline/data\.lock\.json$''']
